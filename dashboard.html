<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42 — Python Core Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07080d;
  --panel:   #0d0f17;
  --border:  #1c1f2e;
  --accent:  #00ffcc;
  --dim:     #2a2f45;
  --text:    #c8cfe0;
  --muted:   #4a5270;
  --red:     #ff4d6a;
  --yellow:  #ffc94d;
  --green:   #00ffcc;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
}

/* scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.07) 2px,
    rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ── Layout ─────────────────────────────────── */
.shell {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 0.08em;
  color: var(--accent);
}

.logo span { color: var(--muted); font-size: 14px; letter-spacing: 0.2em; margin-left: 12px; }

.topbar-meta { color: var(--muted); font-size: 11px; text-align: right; line-height: 1.6; }
.topbar-meta strong { color: var(--text); }

.main {
  display: grid;
  grid-template-columns: 260px 1fr;
  align-items: start;
  min-height: 0;
}

/* ── Sidebar ────────────────────────────────── */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 24px 0;
  background: var(--panel);
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.sidebar-section { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.sidebar-section:last-child { border-bottom: none; margin-bottom: 0; }

.sidebar-label {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

/* upload zone */
.upload-zone {
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--muted);
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); color: var(--accent); }
.upload-zone input { display: none; }
.upload-zone .upload-icon { font-size: 20px; margin-bottom: 6px; }
.upload-zone .upload-text { font-size: 11px; line-height: 1.5; }

/* stat pills */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.stat-row:last-child { border-bottom: none; }
.stat-row .stat-label { color: var(--muted); }
.stat-row .stat-val { font-weight: 600; color: var(--text); }
.stat-row .stat-val.acc { color: var(--accent); }

/* filters */
.filter-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  padding: 7px 12px;
  cursor: pointer;
  margin-bottom: 6px;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--dim); }
.filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,204,0.05); }
.filter-btn .count {
  background: var(--dim);
  border-radius: 3px;
  padding: 1px 7px;
  font-size: 10px;
  color: var(--muted);
}
.filter-btn.active .count { background: rgba(0,255,204,0.15); color: var(--accent); }

/* search */
.search-box {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--muted); }

/* ── Content ────────────────────────────────── */
.content {
  padding: 32px;
  overflow-y: auto;
}

/* Empty / loading states */
.hero-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  color: var(--muted);
  text-align: center;
  gap: 12px;
}
.hero-empty .big { font-family: 'Bebas Neue'; font-size: 64px; color: var(--dim); letter-spacing: 0.05em; }
.hero-empty .msg { font-size: 12px; line-height: 1.8; }

/* section headers */
.sec-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.sec-head h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 0.12em;
  color: var(--text);
}
.sec-head .line { flex: 1; height: 1px; background: var(--border); }

/* ── Heatmap ────────────────────────────────── */
.heatmap-wrap {
  margin-bottom: 40px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.heatmap-grid {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.heatmap-month-row {
  display: flex;
  gap: 3px;
  padding-left: 32px;
  margin-bottom: 2px;
}

.heatmap-month-label {
  width: 12px;
  font-size: 9px;
  color: var(--muted);
  text-align: left;
  margin-right: 3px;
  white-space: nowrap;
  overflow: visible;
}

.heatmap-day-row {
  display: flex;
  align-items: center;
  gap: 3px;
}

.heatmap-day-lbl {
  width: 28px;
  font-size: 9px;
  color: var(--muted);
  text-align: right;
  padding-right: 4px;
  flex-shrink: 0;
}

.hm-cell {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
  cursor: default;
  transition: transform 0.1s, outline 0.1s;
}
.hm-cell:hover { transform: scale(1.6); outline: 1px solid var(--accent); z-index: 5; position: relative; }
.hm-cell[data-c="0"] { background: #111520; }
.hm-cell[data-c="1"] { background: #0a3d2e; }
.hm-cell[data-c="2"] { background: #0a6644; }
.hm-cell[data-c="3"] { background: #00a876; }
.hm-cell[data-c="4"] { background: var(--accent); }

.hm-cell[data-today] { outline: 1px solid var(--accent); }

.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  font-size: 10px;
  color: var(--muted);
  justify-content: flex-end;
}
.hm-leg { width: 12px; height: 12px; border-radius: 2px; }

/* ── Timeline ───────────────────────────────── */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-bottom: 40px;
}

.timeline-day {
  display: flex;
  gap: 0;
}

.tl-date-col {
  width: 110px;
  flex-shrink: 0;
  padding-top: 14px;
  padding-right: 20px;
  text-align: right;
}

.tl-date-label {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.2;
}
.tl-date-label strong { display: block; font-size: 18px; font-family: 'Bebas Neue'; color: var(--text); letter-spacing: 0.05em; }
.tl-date-label.today strong { color: var(--accent); }

.tl-spine-col {
  width: 24px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.tl-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--dim);
  border: 2px solid var(--border);
  margin-top: 18px;
  flex-shrink: 0;
  transition: background 0.2s;
}
.tl-dot.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(0,255,204,0.4); }
.tl-line { flex: 1; width: 1px; background: var(--border); min-height: 8px; }

.tl-cards-col {
  flex: 1;
  padding: 10px 0 10px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-content: flex-start;
}

.proj-chip {
  display: inline-flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 8px 12px;
  min-width: 160px;
  max-width: 240px;
  cursor: default;
  transition: border-color 0.15s, transform 0.15s;
}
.proj-chip:hover { border-color: rgba(0,255,204,0.4); transform: translateY(-1px); }
.proj-chip .chip-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-chip .chip-slug { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-chip .chip-time { font-size: 10px; color: var(--muted); margin-top: 4px; }

.no-activity { color: var(--muted); font-size: 11px; padding: 12px 0; }

/* ── Project Table ──────────────────────────── */
.proj-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 40px;
}
.proj-table th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 500;
}
.proj-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 12px;
}
.proj-table tr:hover td { background: rgba(255,255,255,0.02); }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  letter-spacing: 0.08em;
  font-weight: 600;
}
.badge-today  { background: rgba(0,255,204,0.12); color: var(--accent); }
.badge-week   { background: rgba(0,200,150,0.1); color: #00c8a0; }
.badge-month  { background: rgba(255,201,77,0.1); color: var(--yellow); }
.badge-old    { background: rgba(74,82,112,0.3); color: var(--muted); }

/* ── Tooltip ────────────────────────────────── */
#tt {
  position: fixed;
  background: #1a1d2e;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text);
  pointer-events: none;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.1s;
  max-width: 220px;
}


/* ── Tabs ───────────────────────────────────── */
.tab-bar {
  display: flex;
  gap: 2px;
  padding: 12px 20px 0;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  position: sticky;
  top: 56px;
  z-index: 90;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Diff viewer ────────────────────────────── */
.diff-project {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 16px;
  overflow: hidden;
}
.diff-project-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  transition: background 0.15s;
  gap: 12px;
}
.diff-project-header:hover { background: rgba(255,255,255,0.02); }
.diff-project-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 0.08em;
  color: var(--text);
}
.diff-project-slug { font-size: 10px; color: var(--muted); margin-top: 2px; }
.diff-version-count {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.diff-chevron { color: var(--muted); font-size: 10px; transition: transform 0.2s; flex-shrink: 0; }
.diff-project.open .diff-chevron { transform: rotate(180deg); }

.diff-versions { display: none; border-top: 1px solid var(--border); }
.diff-project.open .diff-versions { display: block; }

.diff-version {
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
}
.diff-version:last-child { border-bottom: none; }

.diff-version-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.diff-ts { font-size: 11px; color: var(--muted); }
.diff-stat { font-size: 10px; padding: 2px 8px; border-radius: 3px; }
.diff-stat-add { background: rgba(0,255,100,0.1); color: #00ff88; }
.diff-stat-del { background: rgba(255,77,100,0.1); color: var(--red); }
.diff-stat-new { background: rgba(0,255,204,0.1); color: var(--accent); }

.diff-body {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  font-size: 12px;
  line-height: 1.7;
  max-height: 320px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.diff-body .ins { background: rgba(0,255,100,0.15); color: #00ff88; border-radius: 2px; padding: 0 1px; }
.diff-body .del { background: rgba(255,77,100,0.15); color: var(--red); border-radius: 2px; padding: 0 1px; text-decoration: line-through; }

.diff-no-change { font-size: 11px; color: var(--muted); font-style: italic; }

.diff-empty {
  text-align: center;
  padding: 64px;
  color: var(--muted);
}
.diff-empty .big { font-family: 'Bebas Neue'; font-size: 48px; color: var(--dim); }

/* ── Scrollbar ──────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }

/* ── Responsive ─────────────────────────────── */
@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .content { padding: 20px 16px; }
  .tl-date-col { width: 70px; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="logo">42 CORE <span>// PYTHON TRACKER</span></div>
    <div class="topbar-meta" id="topMeta">Load a <strong>projects.json</strong> to begin</div>
  </header>

  <div class="main">
    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="sidebar-section">
        <div class="sidebar-label">Data Source</div>
        <label class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept=".json">
          <div class="upload-icon">⬡</div>
          <div class="upload-text">Drop <strong>projects.json</strong><br>or click to browse</div>
        </label>
      </div>

      <div class="sidebar-section" id="statsSection" style="display:none">
        <div class="sidebar-label">Stats</div>
        <div id="statsRows"></div>
      </div>

      <div class="sidebar-section" id="filterSection" style="display:none">
        <div class="sidebar-label">Filter</div>
        <div id="filterBtns"></div>
      </div>

      <div class="sidebar-section" id="searchSection" style="display:none">
        <div class="sidebar-label">Search</div>
        <input class="search-box" id="searchBox" type="text" placeholder="project name or slug…">
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Subject History</div>
        <label class="upload-zone" id="historyUploadZone">
          <input type="file" id="historyFileInput" accept=".json">
          <div class="upload-icon">◈</div>
          <div class="upload-text">Drop <strong>history.json</strong><br>or click to browse</div>
        </label>
      </div>

      <div class="sidebar-section" id="historyStatsSection" style="display:none">
        <div class="sidebar-label">History Stats</div>
        <div id="historyStatsRows"></div>
      </div>

    </aside>

    <!-- Tab bar + content panels -->
    <div style="display:flex;flex-direction:column;min-width:0;flex:1">
      <div class="tab-bar" id="tabBar" style="display:none">
        <button class="tab-btn active" id="tabProjects" onclick="switchTab('projects')">Projects</button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">Subject History</button>
      </div>

      <main class="content" id="content">
        <div class="hero-empty">
          <div class="big">42</div>
          <div class="msg">
            Run <code>python fetch_42_projects.py</code><br>
            then load the generated <code>projects.json</code>
          </div>
        </div>
      </main>

      <main class="content" id="historyContent" style="display:none">
        <div class="diff-empty">
          <div class="big">◈</div>
          <div>Load <code>history.json</code> from the sidebar<br>to view subject diff history</div>
        </div>
      </main>
    </div>
  </div>
</div>

<div id="tt"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let DB = null;
let activeFilter = 'all';
let searchQuery = '';

// ── File loading ──────────────────────────────────────────────────────────────
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');

fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      // Accept both {projects: [...]} envelope and bare array
      DB = Array.isArray(data) ? data : (data.projects || []);
      // Attach meta
      DB._meta = Array.isArray(data) ? {} : { fetched_at: data.fetched_at, python_only: data.python_only };
      init();
    } catch (err) {
      alert('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ── Init ──────────────────────────────────────────────────────────────────────
const now = new Date();
const todayStr = now.toISOString().slice(0, 10);

function ageCategory(dateStr) {
  if (!dateStr) return 'old';
  const d = new Date(dateStr);
  const days = (now - d) / 86400000;
  if (days < 1)  return 'today';
  if (days < 7)  return 'week';
  if (days < 30) return 'month';
  return 'old';
}

function init() {
  buildTopMeta();
  buildStats();
  buildFilters();
  document.getElementById('statsSection').style.display = 'block';
  document.getElementById('filterSection').style.display = 'block';
  document.getElementById('searchSection').style.display = 'block';
  document.getElementById('searchBox').addEventListener('input', e => {
    searchQuery = e.target.value.toLowerCase();
    render();
  });
  render();
}

function buildTopMeta() {
  const m = DB._meta || {};
  const fetched = m.fetched_at ? new Date(m.fetched_at).toLocaleString() : 'unknown';
  document.getElementById('topMeta').innerHTML =
    `<strong>${DB.length}</strong> projects &nbsp;·&nbsp; fetched <strong>${fetched}</strong>`;
}

function buildStats() {
  const cats = DB.map(p => ageCategory(p.updated_at));
  const counts = { today: 0, week: 0, month: 0, old: 0 };
  for (const c of cats) counts[c]++;
  document.getElementById('statsRows').innerHTML = `
    <div class="stat-row"><span class="stat-label">Total</span><span class="stat-val acc">${DB.length}</span></div>
    <div class="stat-row"><span class="stat-label">Updated today</span><span class="stat-val">${counts.today}</span></div>
    <div class="stat-row"><span class="stat-label">This week</span><span class="stat-val">${counts.week}</span></div>
    <div class="stat-row"><span class="stat-label">This month</span><span class="stat-val">${counts.month}</span></div>
    <div class="stat-row"><span class="stat-label">Older</span><span class="stat-val">${counts.old}</span></div>
  `;
}

function buildFilters() {
  const cats = DB.map(p => ageCategory(p.updated_at));
  const counts = { all: DB.length, today: 0, week: 0, month: 0, old: 0 };
  for (const c of cats) counts[c]++;

  const labels = { all: 'All projects', today: 'Today', week: 'This week', month: 'This month', old: 'Older' };
  document.getElementById('filterBtns').innerHTML = Object.entries(labels).map(([k, v]) => `
    <button class="filter-btn${activeFilter === k ? ' active' : ''}" onclick="setFilter('${k}')">
      ${v} <span class="count">${counts[k]}</span>
    </button>
  `).join('');
}

function setFilter(f) {
  activeFilter = f;
  buildFilters();
  render();
}

// ── Filtered projects ─────────────────────────────────────────────────────────
function filteredProjects() {
  return DB.filter(p => {
    const cat = ageCategory(p.updated_at);
    if (activeFilter !== 'all' && cat !== activeFilter) return false;
    if (searchQuery) {
      const h = (p.name + ' ' + p.slug).toLowerCase();
      if (!h.includes(searchQuery)) return false;
    }
    return true;
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const projects = filteredProjects();
  const html = [];

  // Section 1: Heatmap
  html.push(`<div class="sec-head"><h2>Activity Heatmap</h2><div class="line"></div></div>`);
  html.push(`<div class="heatmap-wrap">${buildHeatmap()}</div>`);

  // Section 2: Timeline (only last 30 days)
  html.push(`<div class="sec-head"><h2>Daily Timeline</h2><div class="line"></div></div>`);
  html.push(buildTimeline(projects));

  // Section 3: Full table
  html.push(`<div class="sec-head"><h2>All Projects</h2><div class="line"></div></div>`);
  html.push(buildTable(projects));

  document.getElementById('content').innerHTML = html.join('');
  attachTooltips();
}

// ── Heatmap ───────────────────────────────────────────────────────────────────
function buildHeatmap() {
  // Build date → count map using ALL projects (ignore filter for heatmap)
  const dayMap = {};
  for (const p of DB) {
    if (!p.updated_at) continue;
    const day = p.updated_at.slice(0, 10);
    dayMap[day] = (dayMap[day] || []);
    dayMap[day].push(p);
  }

  const WEEKS = 52;
  const startDate = new Date(now);
  // Start from last Sunday
  startDate.setDate(startDate.getDate() - startDate.getDay());
  startDate.setDate(startDate.getDate() - (WEEKS - 1) * 7);

  // Build grid: grid[col][row]
  const grid = [];
  const d = new Date(startDate);
  for (let col = 0; col < WEEKS; col++) {
    grid[col] = [];
    for (let row = 0; row < 7; row++) {
      grid[col][row] = new Date(d);
      d.setDate(d.getDate() + 1);
    }
  }

  const maxCount = Math.max(1, ...Object.values(dayMap).map(a => a.length));
  function level(count) {
    if (!count) return 0;
    const r = count / maxCount;
    if (r < 0.25) return 1;
    if (r < 0.5)  return 2;
    if (r < 0.8)  return 3;
    return 4;
  }

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS   = ['S','M','T','W','T','F','S'];

  // Month row
  let monthRow = `<div class="heatmap-month-row">`;
  let lastMonth = -1;
  for (let col = 0; col < WEEKS; col++) {
    const m = grid[col][0].getMonth();
    const lbl = (m !== lastMonth) ? MONTHS[m] : '';
    monthRow += `<span class="heatmap-month-label">${lbl}</span>`;
    if (m !== lastMonth) lastMonth = m;
  }
  monthRow += `</div>`;

  // Day rows
  let dayRows = '';
  for (let row = 0; row < 7; row++) {
    const showLbl = (row % 2 === 1) ? DAYS[row] : '';
    dayRows += `<div class="heatmap-day-row"><span class="heatmap-day-lbl">${showLbl}</span>`;
    for (let col = 0; col < WEEKS; col++) {
      const date = grid[col][row];
      const ds = date.toISOString().slice(0, 10);
      const projs = dayMap[ds] || [];
      const c = level(projs.length);
      const todayAttr = (ds === todayStr) ? ' data-today' : '';
      const title = projs.length
        ? `${ds}: ${projs.length} project${projs.length > 1 ? 's' : ''} updated`
        : `${ds}: no updates`;
      dayRows += `<div class="hm-cell" data-c="${c}"${todayAttr} data-tt="${escAttr(title)}"></div>`;
    }
    dayRows += `</div>`;
  }

  const legend = `
    <div class="heatmap-legend">
      Less
      <div class="hm-leg" style="background:#111520"></div>
      <div class="hm-leg" style="background:#0a3d2e"></div>
      <div class="hm-leg" style="background:#0a6644"></div>
      <div class="hm-leg" style="background:#00a876"></div>
      <div class="hm-leg" style="background:var(--accent)"></div>
      More
    </div>`;

  return `<div class="heatmap-grid">${monthRow}${dayRows}</div>${legend}`;
}

// ── Timeline ──────────────────────────────────────────────────────────────────
function buildTimeline(projects) {
  // Build day buckets for the last 30 days
  const dayMap = {};
  for (const p of projects) {
    if (!p.updated_at) continue;
    const day = p.updated_at.slice(0, 10);
    if (!dayMap[day]) dayMap[day] = [];
    dayMap[day].push(p);
  }

  // Generate last 30 days in reverse order
  const days = [];
  for (let i = 0; i < 30; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }

  // Only show days that appear in data (or today) — max 30
  const relevant = days.filter(d => dayMap[d] || d === todayStr);
  if (!relevant.length) {
    return `<div style="color:var(--muted);font-size:12px;margin-bottom:32px">No activity in the last 30 days matching your filter.</div>`;
  }

  let html = `<div class="timeline">`;
  for (const ds of relevant) {
    const projs = dayMap[ds] || [];
    const date = new Date(ds + 'T12:00:00');
    const dayNum = date.getDate();
    const month = date.toLocaleString('en-US', { month: 'short' });
    const weekday = date.toLocaleString('en-US', { weekday: 'short' });
    const isToday = ds === todayStr;

    html += `<div class="timeline-day">
      <div class="tl-date-col">
        <div class="tl-date-label${isToday ? ' today' : ''}">
          <strong>${dayNum} ${month}</strong>${weekday}${isToday ? ' · today' : ''}
        </div>
      </div>
      <div class="tl-spine-col">
        <div class="tl-dot${projs.length ? ' active' : ''}"></div>
        <div class="tl-line"></div>
      </div>
      <div class="tl-cards-col">`;

    if (projs.length) {
      for (const p of projs) {
        const time = new Date(p.updated_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        html += `<div class="proj-chip">
          <div class="chip-name" title="${escAttr(p.name)}">${escHtml(p.name)}</div>
          <div class="chip-slug">${escHtml(p.slug)}</div>
          <div class="chip-time">${time}</div>
        </div>`;
      }
    } else {
      html += `<div class="no-activity">— no updates</div>`;
    }

    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

// ── Table ─────────────────────────────────────────────────────────────────────
function buildTable(projects) {
  if (!projects.length) {
    return `<p style="color:var(--muted);margin-bottom:32px">No projects match your current filter.</p>`;
  }

  const badgeMap = { today: 'badge-today', week: 'badge-week', month: 'badge-month', old: 'badge-old' };
  const labelMap = { today: 'TODAY', week: 'WEEK', month: 'MONTH', old: 'OLDER' };

  let rows = projects.map(p => {
    const cat = ageCategory(p.updated_at);
    const date = p.updated_at ? new Date(p.updated_at).toLocaleString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    }) : '—';
    return `<tr>
      <td style="color:var(--text);font-weight:500">${escHtml(p.name)}</td>
      <td style="color:var(--muted)">${escHtml(p.slug)}</td>
      <td>${date}</td>
      <td><span class="badge ${badgeMap[cat]}">${labelMap[cat]}</span></td>
    </tr>`;
  }).join('');

  return `<table class="proj-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Last Updated</th>
        <th>Age</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
function attachTooltips() {
  const tt = document.getElementById('tt');
  document.querySelectorAll('[data-tt]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tt.textContent = el.dataset.tt;
      tt.style.opacity = '1';
    });
    el.addEventListener('mousemove', e => {
      tt.style.left = (e.clientX + 14) + 'px';
      tt.style.top  = (e.clientY - 30) + 'px';
    });
    el.addEventListener('mouseleave', () => { tt.style.opacity = '0'; });
  });
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s||'').replace(/"/g,'&quot;');
}

// ── Tab switching ─────────────────────────────────────────────────────────────
let activeTab = 'projects';

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('content').style.display        = tab === 'projects' ? '' : 'none';
  document.getElementById('historyContent').style.display = tab === 'history'  ? '' : 'none';
  document.getElementById('tabProjects').classList.toggle('active', tab === 'projects');
  document.getElementById('tabHistory').classList.toggle('active',  tab === 'history');
}

// Show tab bar once any data is loaded
function showTabBar() {
  document.getElementById('tabBar').style.display = 'flex';
}

// ── History file loading ──────────────────────────────────────────────────────
let HISTORY = null;

const historyFileInput  = document.getElementById('historyFileInput');
const historyUploadZone = document.getElementById('historyUploadZone');

historyFileInput.addEventListener('change', e => loadHistoryFile(e.target.files[0]));
historyUploadZone.addEventListener('dragover',  e => { e.preventDefault(); historyUploadZone.classList.add('drag'); });
historyUploadZone.addEventListener('dragleave', () => historyUploadZone.classList.remove('drag'));
historyUploadZone.addEventListener('drop', e => {
  e.preventDefault();
  historyUploadZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadHistoryFile(e.dataTransfer.files[0]);
});

function loadHistoryFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      HISTORY = JSON.parse(ev.target.result);
      initHistory();
    } catch (err) {
      alert('Invalid history.json: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function initHistory() {
  showTabBar();
  buildHistoryStats();
  renderHistory();
  document.getElementById('historyStatsSection').style.display = 'block';
  switchTab('history');
}

function buildHistoryStats() {
  const projects = Object.values(HISTORY.projects || {});
  const totalVersions = projects.reduce((s, p) => s + p.versions.length, 0);
  const withChanges   = projects.filter(p => p.versions.length > 1).length;
  document.getElementById('historyStatsRows').innerHTML = `
    <div class="stat-row"><span class="stat-label">Projects tracked</span><span class="stat-val acc">${projects.length}</span></div>
    <div class="stat-row"><span class="stat-label">Total versions</span><span class="stat-val">${totalVersions}</span></div>
    <div class="stat-row"><span class="stat-label">With changes</span><span class="stat-val">${withChanges}</span></div>
  `;
}

// ── History rendering ─────────────────────────────────────────────────────────
function renderHistory() {
  const projects = Object.values(HISTORY.projects || {});
  if (!projects.length) {
    document.getElementById('historyContent').innerHTML = `
      <div class="diff-empty"><div class="big">◈</div><div>No project history found in this file.</div></div>`;
    return;
  }

  // Sort: most recently changed first
  projects.sort((a, b) => {
    const aLast = a.versions[a.versions.length - 1]?.timestamp || '';
    const bLast = b.versions[b.versions.length - 1]?.timestamp || '';
    return bLast.localeCompare(aLast);
  });

  let html = '';

  // Section: projects with multiple versions (actual changes)
  const changed = projects.filter(p => p.versions.length > 1);
  const stable  = projects.filter(p => p.versions.length === 1);

  if (changed.length) {
    html += `<div class="sec-head"><h2>Changed Subjects</h2><div class="line"></div></div>`;
    html += changed.map(p => buildProjectDiff(p)).join('');
  }

  if (stable.length) {
    html += `<div class="sec-head" style="margin-top:32px"><h2>Stable Subjects</h2><div class="line"></div></div>`;
    html += stable.map(p => buildProjectDiff(p)).join('');
  }

  document.getElementById('historyContent').innerHTML = html;
}

function buildProjectDiff(proj) {
  const versions  = proj.versions || [];
  const vCount    = versions.length;
  const lastTs    = versions[vCount - 1]?.timestamp;
  const lastDate  = lastTs ? new Date(lastTs).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
  const hasChange = vCount > 1;

  const versionsHtml = versions.slice().reverse().map((v, i) => {
    const isFirst   = i === versions.length - 1;  // reversed
    const ts        = new Date(v.timestamp).toLocaleString('en-US', {
      month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'
    });

    let statBadges = '';
    if (isFirst) {
      statBadges = `<span class="diff-stat diff-stat-new">FIRST VERSION · ${v.words_added} words</span>`;
    } else {
      if (v.words_added)   statBadges += `<span class="diff-stat diff-stat-add">+${v.words_added} words</span>`;
      if (v.words_removed) statBadges += `<span class="diff-stat diff-stat-del">-${v.words_removed} words</span>`;
      if (!v.words_added && !v.words_removed) statBadges = `<span class="diff-stat" style="background:rgba(74,82,112,0.3);color:var(--muted)">no text change</span>`;
    }

    // Render diff chunks if available (loaded from diff_file — requires pre-loading)
    // Since we can't fetch local files from HTML, we show a summary instead
    // and offer copy of the diff_file path
    let diffBody = '';
    if (v._chunks) {
      diffBody = renderDiffChunks(v._chunks);
    } else if (!isFirst) {
      diffBody = `<div class="diff-no-change">
        Diff stored in: <code>${proj.slug}/${escHtml(v.diff_file)}</code><br>
        Load individual diff files via the loader below to see word-level changes inline.
      </div>`;
    } else {
      diffBody = `<div class="diff-no-change">Initial version — no previous text to compare against.</div>`;
    }

    return `<div class="diff-version">
      <div class="diff-version-meta">
        <span class="diff-ts">${ts}</span>
        ${statBadges}
      </div>
      <div class="diff-body">${diffBody}</div>
    </div>`;
  }).join('');

  return `<div class="diff-project${hasChange ? ' open' : ''}" id="proj-${escAttr(proj.slug)}">
    <div class="diff-project-header" onclick="toggleProject('${escAttr(proj.slug)}')">
      <div>
        <div class="diff-project-name">${escHtml(proj.name)}</div>
        <div class="diff-project-slug">${escHtml(proj.slug)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="diff-version-count">${vCount} version${vCount !== 1 ? 's' : ''} · last ${lastDate}</span>
        <span class="diff-chevron">▼</span>
      </div>
    </div>
    <div class="diff-versions">${versionsHtml}</div>
  </div>`;
}

function toggleProject(slug) {
  const el = document.getElementById(`proj-${slug}`);
  if (el) el.classList.toggle('open');
}

function renderDiffChunks(chunks) {
  return chunks.map(c => {
    const text = escHtml(c.text);
    if (c.type === 'insert') return `<span class="ins">${text}</span>`;
    if (c.type === 'delete') return `<span class="del">${text}</span>`;
    return text;
  }).join('');
}

// ── Diff file loader (for inline diffs) ──────────────────────────────────────
// Users can load individual .diff.json files to see inline word diffs
function loadDiffFile(file, slug, timestamp) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const chunks = JSON.parse(ev.target.result);
      if (HISTORY?.projects?.[slug]) {
        const ver = HISTORY.projects[slug].versions.find(v => v.timestamp === timestamp);
        if (ver) {
          ver._chunks = chunks;
          renderHistory();
          // Re-open the project
          setTimeout(() => {
            const el = document.getElementById(`proj-${slug}`);
            if (el) el.classList.add('open');
          }, 50);
        }
      }
    } catch (err) {
      alert('Invalid diff file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// Patch init() to show tab bar when projects.json loads
const _origInit = typeof init === 'function' ? init : null;


// Show tab bar when projects load too
const _origBuildTopMeta = buildTopMeta;
function buildTopMeta() {
  _origBuildTopMeta();
  showTabBar();
}
